name: Test

on:
  push:
    branches:
      - main
      - master
    paths:
      - "newpipe-plugin/**"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "newpipe-plugin/**"
  workflow_dispatch:

jobs:
  unit:
    name: Unit tests (newpipe)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: cccpeducation/cccp-ci-base@sha256:03ead3787ed8f09068cc582191e4cd8f5e48e3ce696fe53836ecd826de57ea1f

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify Gradle wrapper version
        uses: cccp-education/conventions-gradle/.github/actions/verify-gradle-wrapper@main

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # GBL-013 US-5 — the runtime image provides JDK 25; the plugin's
      # foojay resolver provisions the JDK 11 toolchain. `ci/run.sh test`
      # runs the newpipe unit tests.
      - name: Run unit tests
        run: ci/run.sh test
